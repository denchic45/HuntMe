openapi: 3.0.3
info:
  title: HuntMe API Specification
  description: >
    Спецификация REST API для платформы-агрегатора ИТ-вакансий HuntMe.
    Платформа реализует обратную механику подбора соискателей с верифицированным
    профилем достижений ФСП (Федерация спортивного программирования).
  version: 1.0.0
  contact:
    name: HuntMe Team
servers:
  - url: /api/v1
    description: Основной сервер API v1
paths:
  /api/v1/auth/me:
    get:
      summary: Идентификатор текущего сеанса
      operationId: getCurrentSession
      tags:
        - Auth
      description: Возвращает только id=sub JWT. БД не вызывается.
      x-implementation-status: implemented
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Текущий сеанс.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/candidate/profile:
    get:
      summary: Профиль текущего кандидата
      operationId: getCandidateProfile
      tags:
        - Candidate Profile
      description: Профиль определяется только по sub JWT. Чужой id запрос
        не принимает.
      x-implementation-status: implemented
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль без обёртки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Создание профиля кандидата
      operationId: createCandidateProfile
      tags:
        - Candidate Profile
      description: Профиль определяется только по sub JWT.  Чужой id запрос
        не принимает. Создаёт только id, full_name, email; остальные поля получают defaults БД.
      x-implementation-status: implemented
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Только fullName и email после TrimSpace; id не возвращается.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCandidateProfileRequest'
        '400':
          description: Ошибка декодирования или обязательных полей.
          content:
            text/plain:
              schema:
                type: string
              examples:
                case1:
                  value: |
                    Invalid JSON
                case2:
                  value: |
                    Full name and email are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ProfileConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateProfileRequest'
    patch:
      summary: Изменение профиля кандидата
      operationId: updateCandidateProfile
      tags:
        - Candidate Profile
      description: Профиль определяется только по sub JWT. Чужой id запрос
        не принимает.
      x-implementation-status: implemented
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Обновлено; тела нет.
        '400':
          description: Ошибка JSON или пустой fullName.
          content:
            text/plain:
              schema:
                type: string
              examples:
                case1:
                  value: |
                    Invalid JSON
                case2:
                  value: |
                    Empty company name
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateProfileRequest'
  /api/v1/candidate/profile/resume:
    post:
      summary: Извлечение текста из PDF
      operationId: extractResumeText
      tags:
        - Candidate Profile
      description: |-
        Защищён JWT, но профиль в БД не требуется.
        При отмене контекста клиента обработчик прекращает работу без формирования ошибки.
      x-implementation-status: implemented
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Извлечённый текст.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeTextResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Ошибка PDF-обработчика.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeError'
              examples:
                case1:
                  value:
                    error: Invalid multipart/form-data
                case2:
                  value:
                    error: PDF field 'file' is required
                case3:
                  value:
                    error: Upload exactly one PDF in field 'file'
                case4:
                  value:
                    error: PDF is empty
                case5:
                  value:
                    error: Expected a PDF file
                case6:
                  value:
                    error: Cannot read PDF; it may be damaged or password-protected
        '413':
          description: Ошибка PDF-обработчика.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeError'
              examples:
                case1:
                  value:
                    error: Request is too large
                case2:
                  value:
                    error: PDF must not exceed 10 MiB
                case3:
                  value:
                    error: Extracted text must not exceed 2 MiB
        '422':
          description: Ошибка PDF-обработчика.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeError'
              examples:
                case1:
                  value:
                    error: No text found in PDF; a scanned document requires OCR
        '500':
          description: Ошибка PDF-обработчика.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeError'
              examples:
                case1:
                  value:
                    error: Cannot open uploaded file
                case2:
                  value:
                    error: Cannot read uploaded file
                case3:
                  value:
                    error: PDF processing failed
        '503':
          description: Ошибка PDF-обработчика.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeError'
              examples:
                case1:
                  value:
                    error: PDF processing exceeded the time limit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Один непустой PDF до 10 MiB.
              required:
                - file
  /api/v1/candidate/fsp:
    post:
      summary: '[Заглушка] Привязка ФСП'
      operationId: linkFspProfile
      tags:
        - Candidate Profile
      description: Маршрут подключён через RequireAuth. После проверки JWT всегда 501 text/plain; тело не читается,
        роль и fspId не проверяются.
      x-implementation-status: stub
      security:
        - BearerAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          description: Подключённая заглушка.
          content:
            text/plain:
              schema:
                type: string
              examples:
                case1:
                  value: |
                    Not implemented
      x-planned-contract:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - fspId
                properties:
                  fspId:
                    type: string
                    example: FSP-2026-8849
        responses:
          '200':
            description: 'ПЛАН: ФСП ID успешно привязан и достижения подтверждены'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PlannedCandidateProfile'
          '404':
            description: 'ПЛАН: Участник с таким FSP ID не найден'
  /api/v1/candidate/privacy:
    patch:
      summary: '[Частично реализован] Настройки приватности'
      operationId: updateCandidatePrivacy
      tags:
        - Candidate Profile
      description: |-
        Профиль определяется только по sub JWT. Чужой id запрос не принимает.
      x-implementation-status: partial
      security:
        - BearerAuth: []
      responses:
        '400':
          description: Ошибка JSON.
          content:
            text/plain:
              schema:
                type: string
              examples:
                case1:
                  value: |
                    Invalid JSON
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrivacyRequest'
      x-unreachable-responses:
        '204':
          description: Ветка после успешного SQL, пустое тело; сейчас недостижима.
        '404':
          $ref: '#/components/responses/ProfileNotFound'
      x-planned-contract:
        description: Сохранённый прежний план, включая ещё не реализованное согласие privacyAgreement152. Не является
          текущим поведением обработчика.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  isPublic:
                    type: boolean
                    description: Участвовать ли в выдаче работодателям
                  privacyAgreement152:
                    type: boolean
                    description: Согласие на обработку персональных данных (152-ФЗ)
                  hideCurrentCompany:
                    type: boolean
                    description: Скрывать профиль от текущего работодателя
  /api/v1/candidate/testing/survey:
    post:
      summary: '[Планируется] Сохранение результатов первичного опроса'
      description: 'Планируемый контракт из репозитория. Операция не подключена: сейчас 404, а requestBody, security
        и responses ниже описывают только план. Выбор специализации, сферы деятельности и заявленного грейда.'
      tags:
        - Candidate Testing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestingSurveyRequest'
      responses:
        '200':
          description: 'ПЛАН: Опрос пройден, создан тест под заявленный грейд'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestingSession'
      operationId: submitTestingSurvey
      x-implementation-status: planned
      x-current-responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
      x-unmounted-stub:
        status: 202
        body: empty
        method-restriction: false
        authenticated: false
        x-implementation-status: stub
  /api/v1/candidate/testing/start:
    post:
      summary: '[Планируется] Запуск сессии тестирования'
      description: 'Планируемый контракт из репозитория. Операция не подключена: сейчас 404, а requestBody, security
        и responses ниже описывают только план. Генерирует или возвращает уникальный набор заданий для подтверждения грейда.'
      tags:
        - Candidate Testing
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 'ПЛАН: Задания тестирования успешно сформированы'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestingSession'
      operationId: startTesting
      x-implementation-status: planned
      x-current-responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
      x-unmounted-stub:
        status: 202
        body: empty
        method-restriction: false
        authenticated: false
        x-implementation-status: stub
  /api/v1/candidate/testing/submit:
    post:
      summary: '[Планируется] Отправка ответов на тест и присвоение категории'
      description: 'Планируемый контракт из репозитория. Рассчитывает балл, определяет подтвержденный грейд и присваивает итоговую категорию.'
      tags:
        - Candidate Testing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSubmitRequest'
      responses:
        '200':
          description: 'ПЛАН: Тест пройден, категория обновлена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResultResponse'
      operationId: submitTestingAnswers
      x-implementation-status: planned
      x-current-responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
      x-unmounted-stub:
        status: 202
        body: empty
        method-restriction: false
        authenticated: false
        x-implementation-status: stub
  /api/v1/employer/candidates/{id}:
    get:
      summary: '[Планируется] Просмотр анонимизированной карточки кандидата'
      description: |
        Планируемый контракт из репозитория. Операция не подключена: сейчас 404, а requestBody, security и responses ниже описывают только план. Детальная информация о кандидате (стек, тесты, категория, история ФСП). Контактные данные (ФИО, email, телефон) скрыты, пока кандидат не примет приглашение.
      tags:
        - Employer Search
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'ПЛАН: Карточка кандидата получена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '404':
          description: 'ПЛАН: Кандидат не найден'
      operationId: getCandidateDetail
      x-implementation-status: planned
      x-current-responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
  /api/v1/employer/invitations:
    post:
      summary: '[Планируется] Направление приглашения конкретному кандидату'
      description: |
        Планируемый контракт из репозитория. Операция не подключена: сейчас 404, а requestBody, security и responses ниже описывают только план. По ТЗ 2.1–2.2: приглашение адресовано конкретному кандидату, содержит предложение, вилку зарплаты в рублях, компанию и способ связи; опубликованная вакансия не обязательна. Требуемые проверки ролей и владельца пока не реализованы. Работодатель создаёт от собственного имени и видит только свои отправленные приглашения и их статусы; id работодателя берётся из JWT. Статусы sent/viewed/accepted/rejected сохранены из прежней спецификации, механизм перехода в viewed ещё не определён. Дополнение contactMethod в required ответа — проектное уточнение, не подтверждённое кодом. Работодатель направляет приглашение соискателю с предложением. ОБЯЗАТЕЛЬНО указывается уровень заработной платы (вилка от-до в рублях).
      tags:
        - Invitations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: 'ПЛАН: Приглашение успешно отправлено кандидату'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
      operationId: employerInvitationsPost
      x-implementation-status: planned
      x-current-responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
    get:
      summary: '[Планируется] Список отправленных компанией приглашений'
      tags:
        - Invitations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 'ПЛАН: Список отправленных компанией приглашений успешно получен'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
      operationId: employerInvitationsGet
      x-implementation-status: planned
      x-current-responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
      description: 'Планируемый контракт из репозитория. Операция не подключена: сейчас 404, а requestBody, security
        и responses ниже описывают только план. По ТЗ 2.1–2.2: приглашение адресовано конкретному кандидату, содержит
        предложение, вилку зарплаты в рублях, компанию и способ связи; опубликованная вакансия не обязательна. Требуемые
        проверки ролей и владельца пока не реализованы. Работодатель создаёт от собственного имени и видит только
        свои отправленные приглашения и их статусы; id работодателя берётся из JWT. Статусы sent/viewed/accepted/rejected
        сохранены из прежней спецификации, механизм перехода в viewed ещё не определён. Дополнение contactMethod
        в required ответа — проектное уточнение, не подтверждённое кодом. '
  /api/v1/candidate/invitations:
    get:
      summary: '[Планируется] Входящие приглашения соискателя от работодателей'
      tags:
        - Invitations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 'ПЛАН: Входящие приглашения успешно получены'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
      operationId: listCandidateInvitations
      x-implementation-status: planned
      x-current-responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
      x-unmounted-stub:
        status: 202
        body: empty
        method-restriction: false
        authenticated: false
        x-implementation-status: stub
      description: 'Планируемый контракт из репозитория. Операция не подключена: сейчас 404, а requestBody, security
        и responses ниже описывают только план. Локальный NewMux не вызывается и не монтируется; его nullHandler
        при отдельном вызове отвечает 202 без тела, без JWT и без ограничения метода. Это не текущий ответ полного
        API-пути. По ТЗ 2.1–2.2: приглашение адресовано конкретному кандидату, содержит предложение, вилку зарплаты
        в рублях, компанию и способ связи; опубликованная вакансия не обязательна. Требуемые проверки ролей и владельца
        пока не реализованы. Кандидат видит и меняет только адресованные ему приглашения: candidateId должен совпадать
        с sub JWT; чужие приглашения недоступны. Статусы sent/viewed/accepted/rejected сохранены из прежней спецификации,
        механизм перехода в viewed ещё не определён. Дополнение contactMethod в required ответа — проектное уточнение,
        не подтверждённое кодом. '
  /api/v1/candidate/invitations/{id}/accept:
    post:
      summary: '[Планируется] Принятие приглашения соискателем'
      description: |
        Планируемый контракт из репозитория. Операция не подключена: сейчас 404, а requestBody, security и responses ниже описывают только план. Локальный NewMux не вызывается и не монтируется; его nullHandler при отдельном вызове отвечает 202 без тела, без JWT и без ограничения метода. Это не текущий ответ полного API-пути. По ТЗ 2.1–2.2: приглашение адресовано конкретному кандидату, содержит предложение, вилку зарплаты в рублях, компанию и способ связи; опубликованная вакансия не обязательна. Требуемые проверки ролей и владельца пока не реализованы. Кандидат видит и меняет только адресованные ему приглашения: candidateId должен совпадать с sub JWT; чужие приглашения недоступны. Принятие раскрывает контакты только работодателю этого приглашения. Статусы sent/viewed/accepted/rejected сохранены из прежней спецификации, механизм перехода в viewed ещё не определён. Дополнение contactMethod в required ответа — проектное уточнение, не подтверждённое кодом. При принятии статус меняется на `accepted`, и контакты соискателя раскрываются работодателю.
      tags:
        - Invitations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'ПЛАН: Приглашение принято, контакты переданы работодателю'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
      operationId: acceptInvitation
      x-implementation-status: planned
      x-current-responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
      x-unmounted-stub:
        status: 202
        body: empty
        method-restriction: false
        authenticated: false
        x-implementation-status: stub
  /api/v1/candidate/invitations/{id}/reject:
    post:
      summary: '[Планируется] Отклонение приглашения соискателем'
      tags:
        - Invitations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'ПЛАН: Приглашение отклонено'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
      operationId: rejectInvitation
      x-implementation-status: planned
      x-current-responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
      x-unmounted-stub:
        status: 202
        body: empty
        method-restriction: false
        authenticated: false
        x-implementation-status: stub
      description: 'Планируемый контракт из репозитория. По ТЗ 2.1–2.2: приглашение адресовано конкретному кандидату, содержит предложение, вилку зарплаты
