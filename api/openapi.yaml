components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Access JWT Keycloak: один заголовок Authorization: Bearer <token>.
        Схема Bearer в заголовке регистронезависима; JWT claim typ должен быть строго Bearer.
        Проверяются подпись RS256 по JWKS, iss=http://localhost:8080/realms/huntme,
        aud, содержащий huntme-api, обязательный непросроченный exp, nbf при наличии и непустой sub.
        Роли и подтверждение email не проверяются. sub используется как id профиля (TEXT, не обязательно UUID).
        Для planned-операций это планируемая аутентификация; у отключённых partial-операций она указана
        в x-handler-security, а фактически сервер отвечает 404 до проверки токена.
  responses:
    Unauthorized:
      description: JWT отсутствует или недействителен; роли и email_verified middleware не проверяет.
      content:
        text/plain:
          schema:
            type: string
          examples:
            case1:
              value: |
                Unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum:
              - Bearer
          description: Всегда Bearer.
    InternalServerError:
      description: Ошибка БД.
      content:
        text/plain:
          schema:
            type: string
          examples:
            case1:
              value: |
                Internal Server Error
    ProfileNotFound:
      description: Нет профиля с id, равным sub JWT.
      content:
        text/plain:
          schema:
            type: string
          examples:
            case1:
              value: |
                Profile not found
    ProfileConflict:
      description: Нарушение уникальности при создании профиля.
      content:
        text/plain:
          schema:
            type: string
          examples:
            case1:
              value: |
                Profile already exists
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      description: JSON-ошибка обработчиков поиска; не формат ошибок middleware или профиля.
      required:
        - error
        - message
    CandidateProfile:
