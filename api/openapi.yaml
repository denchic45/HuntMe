      description: |-
        Тело ограничено 64 KiB (65536 байт); только одно JSON-значение с EOF после него.
        Неизвестные поля игнорируются. JSON null доходит до ошибки обязательного roleTitle.
        Выборка: публичные verified-кандидаты с непустой категорией, совместимой специализацией,
        подтверждённым грейдом не ниже targetGrade и всеми requiredSkills после нормализации.
        При заданном бюджете желаемая зарплата должна существовать и не превышать его (проверки SQL numeric
        и повторно после приведения к bigint). Таймаут запросов БД 5 секунд; его ошибка возвращается как 500.
        Баллы: 40 за все обязательные навыки, 20 за точный грейд или 18 за более высокий,
        до 20 за testScore (20*score/100; без результата 0), до 10 за долю дополнительных словарных навыков
        из projectDescription (если таких нет, +10), +10 за hasFspVerified. Число достижений баллы не меняет.
        Округление до 0.1; сортировка matchScore DESC, candidateId ASC; первые 20, без пагинации и total.
        matchExplanation — фактический составной текст на английском; результаты тестов отсутствуют при SQL NULL.
