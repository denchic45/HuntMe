          example: 5a5f8d7d-8fb0-4c20-9242-ea734649411a
        fullName:
          type: string
          example: Алексей Иванов
        email:
          type: string
          example: alexey@example.com
        phone:
          type: string
          example: +7 (999) 123-45-67
        city:
