          type: string
          example: Backend Developer
        claimedGrade:
          type: string
          example: Middle
        verifiedGrade:
          type: string
          example: Middle
        category:
          type: string
          example: Backend-разработчик с опытом (Middle)
        experienceYears:
          type: number
          example: 3.5
          format: float
        desiredSalary:
          type: integer
          description: Желаемая ЗП в рублях
          example: 220000
          format: int64
        skills:
          type: array
